# CoDEx-Large with 4 paths per entity (max_ppt 8): the exact training command of the released checkpoint
# Training command of the run of 2024-07-25, commit f68ebf8.
# link_prediction/codex-large.ckpt (see configs/link_prediction/codex-large.yaml); also the ppt 8 point of App. G (UNCONFIRMED).
# Machine settings are not part of the config; pass them on the command line, e.g. --device cuda --num_devices 1 --num_workers 8 --wandb_project <name>.
log_dir: "{runs_root}/ablations/codex-large_ppt8"
expname: codex-large_ppt8
train_paths: "{data_root}/path_datasets/codex-large/train/"
valid_paths: "{data_root}/path_datasets/codex-large/val/"
test_paths: "{data_root}/path_datasets/codex-large/test/"
max_ppt: 8
batch_size: 4096
nhead: 2
num_encoder_layers: 2
dim_feedforward: 256
embedding_dim: 128
num_negatives: 99
monitor: valid_link_mrr
patience: 5
dropout: 0.1
lrate: 1e-3
val_num_negatives: 99
ent_aggregation: transformer
lp_loss_fn: ce
accumulate_gradient: 16
label_smoothing: 0.01
node_projector: dummy
path_setup: "20_10"
num_agg_layers: 2
seed: 7
