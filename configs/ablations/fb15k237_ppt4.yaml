# Path-count sensitivity (App. G), FB15k-237 with 2 paths per entity (max_ppt 4).
# Training command of the run of 2024-08-07, commit UNCONFIRMED (not recorded; cluster run).
# UNCONFIRMED: assumed to be the run behind the ppt 4 point of fb_cola_ablation.csv.
# Machine settings are not part of the config; pass them on the command line, e.g. --device cuda --num_devices 1 --num_workers 8 --wandb_project <name>.
expname: fb15k237_ppt4
log_dir: "{runs_root}/ablations/fb15k237_ppt4"
train_paths: "{data_root}/path_datasets/fb15k237/train/"
valid_paths: "{data_root}/path_datasets/fb15k237/val/"
test_paths: "{data_root}/path_datasets/fb15k237/test/"
max_ppt: 4
batch_size: 4096
nhead: 2
num_encoder_layers: 1
dim_feedforward: 256
embedding_dim: 64
num_negatives: 99
monitor: valid_link_mrr
patience: 5
dropout: 0.1
lrate: 1e-3
val_num_negatives: 99
ent_aggregation: transformer
lp_loss_fn: ce
accumulate_gradient: 8
label_smoothing: 0.01
node_projector: dummy
path_setup: "20_10"
num_agg_layers: 1
seed: 7
