# Relation prediction, WN18RR (Table confs_rp).
# Training command of the released checkpoint relation_prediction/wn18rr.ckpt, run of 2025-01-02 at commit 0ab1b97
# with the one-line fix of pathe_trainer.py (injector_params = None) applied.
# Machine settings are not part of the config; pass them on the command line, e.g. --device cuda --num_devices 1 --num_workers 8 --wandb_project <name>.
expname: wn18rr
log_dir: "{runs_root}/relation_prediction/wn18rr"
train_paths: "{data_root}/path_datasets/wn18rr/train/"
valid_paths: "{data_root}/path_datasets/wn18rr/val/"
test_paths: "{data_root}/path_datasets/wn18rr/test/"
path_setup: "20_20"
max_ppt: 4
batch_size: 512
num_negatives: 0
val_num_negatives: 0
nhead: 4
num_encoder_layers: 2
ent_aggregation: transformer
num_agg_layers: 1
num_agg_heads: 1
context_heads: 0
dim_feedforward: 128
embedding_dim: 32
lp_loss_fn: ce
accumulate_gradient: 8
monitor: valid_loss
patience: 10
dropout: 0.1
lrate: 0.001
weight_decay: 0
label_smoothing: 0.01
seed: 46
