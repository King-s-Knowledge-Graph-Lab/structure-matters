# Relation prediction, FB15k-237 (Table confs_rp).
# Training command of the released checkpoint relation_prediction/fb15k237.ckpt, run of 2025-01-05 at commit 0ab1b97
# with the one-line fix of pathe_trainer.py (injector_params = None) applied.
# Machine settings are not part of the config; pass them on the command line, e.g. --device cuda --num_devices 1 --num_workers 8 --wandb_project <name>.
expname: fb15k237
log_dir: "{runs_root}/relation_prediction/fb15k237"
train_paths: "{data_root}/path_datasets/fb15k237/train/"
valid_paths: "{data_root}/path_datasets/fb15k237/val/"
test_paths: "{data_root}/path_datasets/fb15k237/test/"
path_setup: "20_20"
max_ppt: 4
batch_size: 512
num_negatives: 0
val_num_negatives: 0
nhead: 4
num_encoder_layers: 1
ent_aggregation: avg
num_agg_layers: 1
num_agg_heads: 1
context_heads: 0
dim_feedforward: 128
embedding_dim: 64
lp_loss_fn: ce
accumulate_gradient: 8
monitor: valid_loss
patience: 10
dropout: 0.2
lrate: 0.001
weight_decay: 0
label_smoothing: 0.1
seed: 46
