# Transductive link prediction, YAGO3-10 (Table confs_lp).
# Training command of the released checkpoint link_prediction/yago.ckpt (best validation MRR at epoch 10),
# run of 2024-08-03 at commit f68ebf8.
# The released checkpoint is an intermediate one: the run continued to epoch 30 (best validation MRR
# 0.637 there, against 0.598 at epoch 10). Re-running this config trains past the released model.
# Machine settings are not part of the config; pass them on the command line, e.g. --device cuda --num_devices 1 --num_workers 8 --wandb_project <name>.
log_dir: "{runs_root}/link_prediction/yago"
expname: yago
train_paths: "{data_root}/path_datasets/yago/train/"
valid_paths: "{data_root}/path_datasets/yago/val/"
test_paths: "{data_root}/path_datasets/yago/test/"
path_setup: "20_10"
max_ppt: 4
batch_size: 1024
num_negatives: 99
val_num_negatives: 99
nhead: 4
num_encoder_layers: 2
ent_aggregation: transformer
num_agg_layers: 2
num_agg_heads: 1
context_heads: 0
dim_feedforward: 256
embedding_dim: 64
lp_loss_fn: ce
accumulate_gradient: 32
monitor: valid_link_mrr
patience: 10
dropout: 0.1
lrate: 0.001
weight_decay: 0.0
label_smoothing: 0.2
seed: 7
