# Inductive link prediction, WN18RR v4 (GraIL split; table of Section 5.3).
# Training command of the released checkpoint inductive/wn18rr_v4.ckpt, run of 2026-10-06 at commit b599dd8.
# Machine settings are not part of the config; pass them on the command line, e.g. --device cuda --num_devices 1 --num_workers 8 --wandb_project <name>.
log_dir: "{runs_root}/inductive/wn18rr/v4"
expname: wn18rr_v4
train_paths: "{data_root}/path_datasets/wn18rr/v4/train/"
valid_paths: "{data_root}/path_datasets/wn18rr/v4/val/"
test_paths: "{data_root}/path_datasets/wn18rr/v4/test/"
inference_paths: "{data_root}/path_datasets/wn18rr/v4/inference/"
max_ppt: 2
batch_size: 1024
nhead: 2
num_encoder_layers: 1
dim_feedforward: 256
embedding_dim: 64
num_negatives: 99
monitor: valid_link_hits10
patience: 10
dropout: 0.1
lrate: 5e-4
val_num_negatives: 50
ent_aggregation: avg
lp_loss_fn: ce
accumulate_gradient: 8
label_smoothing: 0.01
node_projector: dummy
path_setup: "20_10"
num_agg_layers: 1
seed: 7
